name: APK Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip'i aç
        run: unzip -o SalmanStokTakip_AndroidProject.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle wrapper oluştur
        working-directory: SalmanStokTakip
        run: gradle wrapper --gradle-version 8.7

      - name: gradlew çalıştırılabilir yap
        working-directory: SalmanStokTakip
        run: chmod +x ./gradlew

      - name: APK derle
        working-directory: SalmanStokTakip
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SalmanStokTakip-APK
          path: SalmanStokTakip/app/build/outputs/apk/debug/SalmanStokTakip.apk
